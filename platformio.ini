; Shared firmware configuration with one environment per board.
;   [env:tdeck]     -> T-Deck Plus (default)
;   [env:tpager]    -> T-Lora-Pager
;   [env:cardputer] -> Cardputer Adv
; [common] holds only truly-universal flags; [lvgl16_base] adds the 16MB
; PSRAM/LVGL tier (tdeck/tpager); [cardputer_base] uses 8MB flash without PSRAM.

[platformio]
default_envs = tdeck
boards_dir = boards

[common]
platform = espressif32@6.7.0
framework = arduino

build_flags =
    -std=gnu++17
    -fexceptions
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    ; Keep message I/O off the UI/network owner on every board and scheduler.
    -DSTORAGE_DEFERRED_IO=1
    "-I${PROJECT_DIR}"
    "-I${PROJECT_DIR}/src/core"

build_unflags =
    -fno-exceptions
    -std=gnu++11

lib_deps =
    bblanchon/ArduinoJson@7.4.3

extra_scripts =
    pre:tools/check_build_identity.py
    pre:tools/patch_wifi_sockets_pio.py
    pre:tools/patch_wifi_runtime_pio.py
    pre:tools/patch_hwcdc_pio.py
    post:tools/merge_firmware.py

monitor_speed = 115200
upload_speed = 460800
upload_flags = --no-stub

[lvgl16_base]
extends = common

board_build.flash_size = 16MB
board_build.partitions = partitions/standalone-16mb.csv
board_upload.flash_size = 16MB

build_flags =
    ${common.build_flags}
    -O2
    ; Silence vfs_api log_e noise — it fires on every open/remove of a missing
    ; file (normal for our atomic-save + tiered-read patterns). log_e routes to
    ; ets_printf, so esp_log_level_set doesn't help; only compile-time works.
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DLV_CONF_INCLUDE_SIMPLE
    "-I${PROJECT_DIR}/src/ui/lvgl"
    ; Task watchdog is already enabled by ESP-IDF defaults (5s timeout)

lib_deps =
    ${common.lib_deps}
    lovyan03/LovyanGFX@1.1.16
    lvgl/lvgl@8.3.11

lib_archive = false

[tdeck_base]
extends = lvgl16_base
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
build_src_filter = +<core/> +<ui/lvgl/> +<boards/tdeck/>
build_flags =
    ${lvgl16_base.build_flags}
    -DRSDECK=1
    -DDISPLAY_WIDTH=320
    -DDISPLAY_HEIGHT=240
    "-I${PROJECT_DIR}/src/boards/tdeck"

[tpager_base]
extends = lvgl16_base
board = lilygo_t_pager
board_build.f_flash = 80000000L
board_build.flash_mode = dio
board_build.arduino.memory_type = dio_qspi
build_src_filter = +<core/> +<ui/lvgl/> +<boards/tpager/>
build_flags =
    ${lvgl16_base.build_flags}
    -DRATPAGER=1
    -DDISPLAY_WIDTH=480
    -DDISPLAY_HEIGHT=222
    "-I${PROJECT_DIR}/src/boards/tpager"

; T-Pager, LR1121 radio-module variant (LilyGo sells the T-Pager with a choice
; of swappable radio modules). Additive sibling of tpager_base — never edit
; tpager_base/env:tpager/env:tpager_cooperative for this; they're the SX1262
; build with working hardware in the field.
[tpager_lr1121_base]
extends = tpager_base
build_flags =
    ${tpager_base.build_flags}
    -DRATPAGER_LR1121=1
    -DRSRADIO_LR11X0=1
lib_deps =
    ${lvgl16_base.lib_deps}
    https://github.com/jgromes/RadioLib.git#510e00cfb05bbc3c2b7b524262785454944adb6e

[env:tpager_lr1121]
extends = tpager_lr1121_base
build_flags =
    ${tpager_lr1121_base.build_flags}
    ${protocol_small.build_flags}
    -DDEVICE_SERVICE_TASK=1

; Seeed SenseCAP Indicator D1L: LVGL + 8MB flash + PSRAM (unlike Cardputer,
; 8MB flash does NOT mean no PSRAM here — PSRAM is confirmed present and
; needed for the RGB panel's framebuffer; flash size is the real, confirmed
; hardware fact from a working port of this exact device elsewhere, not
; guessed). Minimal hardware-bring-up main.cpp for now (see TODO.md) — no
; protocol/Rust FFI linking yet, that's the deliberate next phase once this
; is confirmed working on real hardware.
[sensecap_d1l_base]
extends = common
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi

; This board's ESP32-S3 has no native USB wired to the host — only a CH340
; UART0 bridge (confirmed on real hardware: Serial output silently goes
; nowhere with the inherited ARDUINO_USB_CDC_ON_BOOT=1, since that routes
; Serial to the unconnected native-USB peripheral instead of UART0). Same
; situation and same fix as m9_base, which has an identical CH340 bridge.
build_unflags =
    ${common.build_unflags}
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

board_build.flash_size = 8MB
board_build.partitions = partitions/standalone-8mb.csv
board_upload.flash_size = 8MB

; Minimal bring-up doesn't use WiFi at all yet, so the two WiFi-socket SDK
; patch scripts never see their expected sources compiled and fail a
; "selected exactly once" sanity check — they assume every env uses WiFi,
; true for every other board today. merge_firmware.py's post-build step
; also verifies SDK backports (DHCP/RTC/TLS) this minimal build has no
; reason to include either. All dropped here, not disabled upstream;
; Phase 2 (full app, which does use WiFi/RTC/TLS) should restore the full
; common.extra_scripts list instead of continuing to override this. A
; plain firmware.bin/.elf (not the merged factory image) is all this
; phase needs — `pio run -t upload` works directly against it.
extra_scripts =
    pre:tools/check_build_identity.py
    pre:tools/patch_hwcdc_pio.py

; Minimal hardware-bring-up main.cpp (no LVGL/UIManager/app wiring yet — see
; TODO.md and main.cpp's own header comment) deliberately pulls in only the
; directories it actually needs, rather than the whole core/ tree minus an
; ever-growing exclusion list — almost everything else in core/ (runtime/,
; reticulum/, history/, transport/, storage/, ui/) reaches the Rust FFI
; protocol headers transitively, which this env doesn't link yet.
; core/compat/ (DHCP/RTC/TLS SDK backports) is excluded too — those exist to
; fix ESP-IDF bugs in WiFi-AP/deep-sleep/TLS paths this minimal build
; doesn't exercise, and their own post-build verification (above) assumes
; every build does.
build_src_filter =
    +<core/config/>
    -<core/config/UserConfig.cpp>
    -<core/config/SettingsTransaction.cpp>
    +<core/hal/>
    +<core/radio/>
    -<core/radio/SX1262.cpp>
    +<boards/sensecap_d1l/>
build_flags =
    ${common.build_flags}
    -O2
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=0
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DLV_CONF_INCLUDE_SIMPLE
    "-I${PROJECT_DIR}/src/ui/lvgl"
    -DRSSENSECAPD1L=1
    "-I${PROJECT_DIR}/src/boards/sensecap_d1l"

lib_deps =
    ${common.lib_deps}
    lovyan03/LovyanGFX@1.1.16
    lvgl/lvgl@8.3.11
    https://github.com/jgromes/RadioLib.git#510e00cfb05bbc3c2b7b524262785454944adb6e

lib_archive = false

[env:sensecap_d1l]
extends = sensecap_d1l_base

; Cardputer Adv: 8MB flash, no PSRAM.
[cardputer_base]
extends = common
board = esp32-s3-devkitc-1

board_build.flash_size = 8MB
board_build.partitions = partitions/standalone-8mb.csv
board_upload.flash_size = 8MB

build_src_filter = +<core/> +<ui/canvas/> +<boards/cardputer/>
build_flags =
    ${common.build_flags}
    ; Endpoint node — balanced for ~55KB free heap (8-bit canvas saves 32KB)
    -DRSCARDPUTER=1
    -DDISPLAY_WIDTH=240
    -DDISPLAY_HEIGHT=135
    "-I${PROJECT_DIR}/src/ui/canvas"
    "-I${PROJECT_DIR}/src/boards/cardputer"

lib_deps =
    ${common.lib_deps}
    https://github.com/m5stack/M5GFX.git#53a7184601f3667b030ba141c58b87ce2acfaa2a
    https://github.com/m5stack/M5Unified.git#a6256725481f1bc366655fa48cf03b6095e30ad1
    ; Resolve the exact IRremote before M5Cardputer requests its dependency.
    https://github.com/Arduino-IRremote/Arduino-IRremote.git#69d36199d606ab56de1f0f990f2b01f416a9cc9f
    https://github.com/m5stack/M5Cardputer.git#e0232804763d3e42d7e9be90e43cf6e1c9e7565b

upload_protocol = esptool

; Rust envs link the prebuilt FFI staticlib (protocol/prebuilt, rebuilt via
; protocol/build-xtensa.sh — one .a per transport table profile). RS_HANDHELD_FFI_LINKED
; gates the boot-time linkage proof in each board main.cpp. Profile split: SMALL (node in PSRAM)
; = tdeck/tpager; MICRO (<= 32 KB node,
; internal heap) = cardputer.
[protocol]
build_flags =
    -DRS_HANDHELD_FFI_LINKED=1
    "-I${PROJECT_DIR}/protocol/include"
    -lratspeak_protocol

; ThinkNode M9 Standalone: UART via CH340, 16MB flash and octal PSRAM.
; RNode/Full are not available yet.
[m9_base]
extends = lvgl16_base
upload_speed = 115200
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.f_flash = 80000000L
build_src_filter = +<core/> -<core/radio/SX1262.cpp> +<ui/lvgl/> +<boards/m9/>
build_unflags =
    ${common.build_unflags}
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
build_flags =
    ${lvgl16_base.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=0
    -DRSM9=1
    -DDISPLAY_WIDTH=320
    -DDISPLAY_HEIGHT=240
    "-I${PROJECT_DIR}/src/boards/m9"
lib_deps =
    ${lvgl16_base.lib_deps}
    https://github.com/jgromes/RadioLib.git#ef715e1be6643ffb6cc585cde4c33770caf875b1

[env:m9]
extends = m9_base
build_flags =
    ${m9_base.build_flags}
    ${protocol_small.build_flags}
    -DDEVICE_SERVICE_TASK=1

[protocol_small]
build_flags =
    ${protocol.build_flags}
    "-L${PROJECT_DIR}/protocol/prebuilt/xtensa-esp32s3/small"

[protocol_micro]
build_flags =
    ${protocol.build_flags}
    "-L${PROJECT_DIR}/protocol/prebuilt/xtensa-esp32s3/micro"

[env:tdeck]
extends = tdeck_base
build_flags =
    ${tdeck_base.build_flags}
    ${protocol_small.build_flags}
    -DDEVICE_SERVICE_TASK=1

[env:tpager]
extends = tpager_base
build_flags =
    ${tpager_base.build_flags}
    ${protocol_small.build_flags}
    -DDEVICE_SERVICE_TASK=1

[env:cardputer]
extends = cardputer_base
build_flags =
    ${cardputer_base.build_flags}
    ${protocol_micro.build_flags}

; Cooperative scheduling is available for debugging, not release packaging.
[env:tdeck_cooperative]
extends = env:tdeck
build_flags =
    ${tdeck_base.build_flags}
    ${protocol_small.build_flags}
    -DDEVICE_SERVICE_TASK=0

[env:tpager_cooperative]
extends = env:tpager
build_flags =
    ${tpager_base.build_flags}
    ${protocol_small.build_flags}
    -DDEVICE_SERVICE_TASK=0
